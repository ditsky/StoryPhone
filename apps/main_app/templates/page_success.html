<!DOCTYPE html>
<html>
<head>
    <title>Page Saved Successfully</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .success-message {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .story-info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .story-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        a, button {
            display: inline-block;
            padding: 10px 20px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h1>✓ Page Saved Successfully!</h1>

    <div class="success-message">
        <p>Your story page has been saved to the database.</p>
    </div>

    <div class="story-info">
        <div class="story-title">Story: {{ title.title }}</div>
        <p>Total pages: {{ title.pages.count }}</p>
    </div>

    <div class="button-group">
        <a href="{% url 'main_app:add_story_page_with_id' title.id %}" class="btn-success">Add Another Page</a>
        <a href="{% url 'main_app:add_story_page' %}" class="btn-primary">Add Page to Different Story</a>
        <a href="{% url 'main_app:create_title' %}" class="btn-secondary">Create New Story</a>
    </div>
</body>
</html>
