<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Create or Join Lobby</title>
</head>
<body>
  <h1>Create a Lobby</h1>
  <form method="post">
    {% csrf_token %}
    <label>Host name: <input name="host_name" value="{{ host_name|default:'Host' }}"></label>
    <button type="submit">Create Lobby</button>
  </form>

  <hr>

  <h1>Join a Lobby</h1>
  {% if join_error %}<p style="color:red">{{ join_error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Code: <input name="code"></label>
    <label>Your name: <input name="name"></label>
    <button type="submit">Join</button>
  </form>
</body>
</html>
