<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Join Lobby</title>
</head>
<body>
  <h1>Join a Lobby</h1>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Code: <input name="code"></label>
    <label>Your name: <input name="name"></label>
    <button type="submit">Join</button>
  </form>
</body>
</html>
