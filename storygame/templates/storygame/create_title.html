<!DOCTYPE html>
<html>
<head>
    <title>Create a Title</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Enter a Title</h1>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Enter your title here" required>
        <button type="submit">Save Title</button>
    </form>
</body>
</html>
